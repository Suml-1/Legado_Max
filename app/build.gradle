// ---------- Android Lint 自适应范围（详见 docs/project-rules/build-commands.md） ----------
// 目标：只改 app 主源码时快跑（跳过依赖模块连带分析 + 测试源码分析）；
// 一旦触及依赖模块(:modules:*)、测试源码、或构建/lint 配置，则回退全量。
// 逃生阀：-PlintFast 强制快跑；-PlintFull 强制全量；-PlintBase=<ref> 指定比较基线（默认 origin/main）。
// CI（env CI/GITHUB_ACTIONS）一律全量，门禁永不降级。
def lintResolveScope = {
    if (project.hasProperty('lintFull')) return [true, '显式 -PlintFull', true]
    if (project.hasProperty('lintFast')) return [false, '显式 -PlintFast', true]
    if (System.getenv('CI') != null || System.getenv('GITHUB_ACTIONS') != null) {
        return [true, 'CI 环境', true]
    }
    def taskNames = project.gradle.startParameter.taskNames.collect { it.toLowerCase() }
    def askingLint = taskNames.any {
        it.contains('lint') || it == 'check' || it.endsWith(':check') || it.contains('build')
    }
    if (!askingLint) return [true, '非 lint 调用', false]  // 不跑 git，也不打日志

    def gitText = { List args ->
        try {
            def spec = providers.exec {
                commandLine(['git'] + args)
                workingDir = rootDir
            }
            // 非零退出（如基线 ref 不存在）视为失败 → 上层保守回退全量
            if (spec.result.get().exitValue != 0) return null
            return spec.standardOutput.asText.get()
        } catch (ignored) {
            return null
        }
    }
    def base = (project.findProperty('lintBase') ?: 'origin/main') as String
    def changed = new LinkedHashSet<String>()
    def diff = gitText(['diff', '--name-only', "${base}...HEAD"])
    if (diff == null) return [true, "git 不可用或基线 ${base} 缺失，保守全量", true]
    diff.readLines().collect { it.trim() }.findAll { it }.each { changed << it.replace('\\', '/') }
    def status = gitText(['status', '--porcelain', '-u'])
    status?.readLines()?.findAll { it.trim() }?.each { line ->
        def path = line.substring(2).trim()
        if (path.contains(' -> ')) path = path.split(' -> ')[-1]
        changed << path.replace('\\', '/')
    }
    def needsFull = changed.any { f ->
        f.startsWith('modules/') ||
            f.contains('/src/test/') || f.contains('/src/androidTest/') ||
            f == 'build.gradle' || f == 'settings.gradle' || f == 'gradle.properties' ||
            f == 'gradle/libs.versions.toml' || f.endsWith('build.gradle') ||
            f.contains('lint-baseline.xml') || f == 'app/lint.xml'
    }
    def reason = changed.isEmpty() ? '无改动' : (needsFull ? '触及依赖模块/测试源码/构建配置' : '仅 app 主源码')
    return [needsFull, reason, true]
}

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

static def releaseCode() {
    return new Date().format("yyDDDHHmm", TimeZone.getTimeZone("GMT+8")).toInteger()
}

def name = "legado"
def version = "3." + releaseTime()
def gitCommits = 0
def bundledReleaseStoreFile = rootProject.file(".github/workflows/legado.jks")
def resolvedReleaseStoreFile = project.findProperty("RELEASE_STORE_FILE") ? file(project.property("RELEASE_STORE_FILE")) : (bundledReleaseStoreFile.exists() ? bundledReleaseStoreFile : null)
def resolvedReleaseKeyAlias = project.findProperty("RELEASE_KEY_ALIAS") ?: "legado"
def resolvedReleaseStorePassword = project.findProperty("RELEASE_STORE_PASSWORD") ?: "gedoor_legado"
def resolvedReleaseKeyPassword = project.findProperty("RELEASE_KEY_PASSWORD") ?: "gedoor_legado"
try {
    def result = 'git rev-list HEAD --count'.execute().text.trim()
    if (result && result.isNumber()) {
        gitCommits = Integer.parseInt(result)
    }
} catch (Exception ignored) {
}

android {
    compileSdk = 37
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (resolvedReleaseStoreFile != null) {
            myConfig {
                storeFile = resolvedReleaseStoreFile
                storePassword = resolvedReleaseStorePassword
                keyAlias = resolvedReleaseKeyAlias
                keyPassword = resolvedReleaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId  = "io.legado.app.yuedu"
        minSdk = 23
        targetSdk = 37
        versionCode = releaseCode()
        versionName = version
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        // 👇 就是这行，修复渠道占位符报错
        manifestPlaceholders = [APP_CHANNEL_VALUE: "local"]

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }
    flavorDimensions "app"
    productFlavors {
        appS {
            dimension = "app"
            applicationId = "io.legado.app.yuedu.a"
            manifestPlaceholders = [app_name: "@string/app_name_a"]
        }
        appLegacy {
            dimension = "app"
            applicationId = "io.legado.app"
            manifestPlaceholders = [app_name: "@string/app_name"]
        }
        appMax {
            dimension = "app"
            applicationId = "io.legado.app.yuedu"
            manifestPlaceholders = [app_name: "@string/app_name"]
        }
    }
    buildTypes {
        release {
            if (resolvedReleaseStoreFile != null) {
                signingConfig = signingConfigs.myConfig
            }
            applicationIdSuffix = '.release'

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (resolvedReleaseStoreFile != null) {
                signingConfig = signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name_debug")

            applicationIdSuffix = '.debug'
            versionNameSuffix = 'debug'
            // minifyEnabled true
            // shrinkResources = true
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    // ABI 分拆仅用于 Release 发布产物；Debug 本地构建保持单一 universal 包，
    // 避免按 armeabi-v7a/arm64-v8a/universal 重复打包拖慢日常构建。
    // 配置缓存已关闭（gradle.properties: unsafe.configuration-cache=false），读取任务名安全。
    def enableAbiSplits = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('release')
    }
    logger.lifecycle("ABI splits enabled: {} (tasks: {})", enableAbiSplits, gradle.startParameter.taskNames)
    splits {
        abi {
            enable enableAbiSplits
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def flavorName = variant.flavorName
            def flavorLabel = [
                    appS     : "正式版",
                    appMax   : "测试版",
                    appLegacy: "兼容版"
            ][flavorName] ?: flavorName
            def flavorSuffix = [
                    appS     : "releaseS",
                    appMax   : "release",
                    appLegacy: "legacy"
            ][flavorName] ?: flavorName
            // ABI splits: 从输出目录名提取 ABI 标识
            // splits.abi 启用后，output.dirName 会是 "armeabi-v7a" / "arm64-v8a" / "" (universal)
            def outputDir = output.dirName ?: ""
            def abiPart = "_universal"
            if (outputDir.contains("armeabi-v7a")) {
                abiPart = "_armeabi-v7a"
            } else if (outputDir.contains("arm64-v8a")) {
                abiPart = "_arm64-v8a"
            }
            outputFileName = "${name}_${flavorLabel}_${defaultConfig.versionName}_${flavorSuffix}${abiPart}.apk"
        }
    }


    room {
        schemaDirectory "$projectDir/schemas" 
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")
        arg("skipPrivatePreviews", "true")
    }
    
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
    }
    
    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        // 自适应范围：仅改 app 主源码→快跑（不连带依赖模块、不分析测试源码）；否则全量
        def scope = lintResolveScope()
        checkDependencies = scope[0]
        checkTestSources = scope[0]
        if (scope[2]) {
            logger.lifecycle("[lint] 范围=${scope[0] ? '全量' : '快跑(仅 app 主源码)'}（原因：${scope[1]}）")
        }
        // 存量问题基线：初次启用 lint 门禁时一次全量生成，此后 lint 只拦新增问题
        baseline = file("lint-baseline.xml")
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }

}

