name: Release Build 双包打包

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      gitee: ${{ steps.check.outputs.gitee }}
      contributors_content: ${{ steps.contributors.outputs.content }}
    steps:
      - id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT
      - id: check
        run: |
          if [ -n "${{ secrets.GITEE_TOKEN }}" ]; then
            echo "gitee=yes" >> $GITHUB_OUTPUT
          fi

      # 发布说明的「PR + 贡献者」章节（与 test.yml 共用同一脚本）
      - uses: actions/checkout@v5
      - name: Setup Node (release notes)
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - id: contributors
        name: Generate Contributor Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_HEAD_REF: ${{ github.sha }}
          RELEASE_CURRENT_TAG: ${{ steps.set-ver.outputs.version }}
        run: |
          node .github/scripts/release-notes.mjs --out release-notes-contributors.md || echo "::warning::贡献者章节生成失败，本次发版不附带该章节"
          CONTENT_JSON=$(jq -Rs . release-notes-contributors.md 2>/dev/null || echo '""')
          echo "content=$CONTENT_JSON" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: [ appS, appMax, appLegacy ]   # 打三个包：共存版、测试版、兼容版
      fail-fast: false
      max-parallel: 4
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    env:
      product: ${{ matrix.product }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 统一版本号
        run: |
          sed "/def version/c def version = \"${{ env.VERSION }}\"" app/build.gradle -i

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: 开始打包
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}Release --parallel --build-cache --no-daemon

      - name: 上传 APK（带产品标识）
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.product }}_apk
          path: app/build/outputs/apk/${{ env.product }}/release/*.apk
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有 APK
        uses: actions/download-artifact@v7
        with:
          pattern: '*_apk'
          path: all_apks
          merge-multiple: true

      - name: 列出下载的文件（调试用）
        run: ls -la all_apks/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 阅读双包版 ${{ needs.prepare.outputs.version }}
          tag_name: ${{ needs.prepare.outputs.version }}
          body: |
            ## 自动打包：两个版本共存
            
            - 📱 阅读A·Max
            - 📱 阅读·Max
            
            两个版本可以同时安装，互不冲突。

            ${{ fromJSON(needs.prepare.outputs.contributors_content || '""') }}
          files: all_apks/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitee:
    needs: [prepare, build]
    if: github.event_name != 'pull_request' && needs.prepare.outputs.gitee == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有 APK
        uses: actions/download-artifact@v7
        with:
          pattern: '*_apk'
          path: all_apks
          merge-multiple: true

      - name: 发布到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: "GEd520"
          GITEE_REPO: "legados"
          VERSION: ${{ needs.prepare.outputs.version }}
          CONTRIBUTORS_JSON: ${{ needs.prepare.outputs.contributors_content || '""' }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          API_BASE="https://gitee.com/api/v5/repos/$GITEE_USER/$GITEE_REPO"
          AUTH_HEADER="Authorization: token $GITEE_TOKEN"
          
          TAG_NAME="$VERSION"
          RELEASE_NAME="阅读双包版 $VERSION"
          CONTRIBUTORS=$(printf '%s' "$CONTRIBUTORS_JSON" | jq -r . 2>/dev/null || true)
          RELEASE_BODY=$(printf '## 自动打包：两个版本共存\n\n- 📱 阅读A·Max\n- 📱 阅读·Max\n- 📱 阅读·兼容版\n\n三个版本可以同时安装，互不冲突。\n')
          if [ -n "$CONTRIBUTORS" ]; then
            RELEASE_BODY=$(printf '%s\n%s\n' "$RELEASE_BODY" "$CONTRIBUTORS")
          fi
          
          echo "📦 直接创建新release，保留历史版本"
          
          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG_NAME" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            --arg target_commitish "main" \
            '{tag_name: $tag_name, name: $name, body: $body, target_commitish: $target_commitish, prerelease: false}')
          RELEASE_JSON=$(curl -sS -X POST \
              -H "Content-Type: application/json" \
              -H "$AUTH_HEADER" \
              -d "$PAYLOAD" \
              "$API_BASE/releases")
          
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "❌ 创建Release失败"
            exit 1
          fi
          
          echo "🚀 开始并行上传APK文件..."
          PIDS=()
          for APK_FILE in all_apks/*.apk; do
            curl -sS -X POST \
              -H "$AUTH_HEADER" \
              -F "file=@$APK_FILE" \
              "$API_BASE/releases/$RELEASE_ID/attach_files" &
            PIDS+=($!)
          done
          
          for PID in "${PIDS[@]}"; do
            wait $PID
          done
          echo "✅ 所有APK上传完成"